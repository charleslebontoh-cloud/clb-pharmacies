name: veritas-veille
on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/compliance_news.py
      - run: |
          git config user.name "veritas-bot"; git config user.email "actions@users.noreply.github.com"
          git add compliance/data/news.json
          git diff --cached --quiet && exit 0
          git commit -qm "VERITAS : veille du $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do git pull -q --rebase -X theirs origin main && git push -q && break; sleep 5; done
