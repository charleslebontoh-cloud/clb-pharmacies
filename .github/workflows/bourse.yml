name: sentinel-bourse
on:
  schedule:
    - cron: "5,35 9-15 * * 1-5"
    - cron: "20 18 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "live | night | full"
        default: night
concurrency:
  group: sentinel
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NTFY_TOPIC: sentinel-brvm-dbde7f93c237
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q numpy
      - name: Analyse
        run: |
          M="${{ github.event.inputs.mode }}"
          if [ -z "$M" ]; then if [ "$(date -u +%H)" -ge 18 ]; then M=night; else M=live; fi; fi
          python tools/bourse.py "$M"
      - name: Commit
        if: always()
        run: |
          git config user.name "sentinel-bot"; git config user.email "actions@users.noreply.github.com"
          git add bourse/data
          git diff --cached --quiet && exit 0
          git commit -qm "Sentinel : données BRVM $(date -u +%Y-%m-%dT%H:%M)"
          for i in 1 2 3; do git pull -q --rebase -X theirs origin main && git push -q && break; sleep 5; done
