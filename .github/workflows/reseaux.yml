name: reseaux
on:
  workflow_dispatch:
    inputs:
      step: {default: "build"}
      budget: {default: "1500"}
permissions: {contents: write}
jobs:
  r:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y poppler-utils >/dev/null
      - run: |
          mkdir -p reseaux/raw
          get(){ if [ ! -s reseaux/raw/$1.txt ] || [ "${{ inputs.step }}" = "fetch" ]; then curl -sSL -A "Mozilla/5.0" -o reseaux/raw/$1.pdf "$2" && pdftotext -layout reseaux/raw/$1.pdf reseaux/raw/$1.txt; wc -l reseaux/raw/$1.txt; fi; }
          get vitalis-full https://services.vitalis-ci.com/reseaudesoin/PRESENTATION.pdf
          get atlantique https://www.atlantique-assurances.net/wp-content/uploads/2024/07/RESEAU-DE-SOINS-AACI-ABIDJAN.pdf
          if [ "${{ inputs.step }}" = "build" ]; then BUDGET=${{ inputs.budget || 1500 }} python3 tools/reseaux.py all; fi
      - if: always()
        run: |
          git config user.name clb-bot; git config user.email bot@users.noreply.github.com
          git add reseaux; git commit -m "reseaux: ${{ inputs.step }}" || exit 0
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done
