name: reseaux
on:
  workflow_dispatch:
    inputs:
      step: {default: "fetch"}
permissions: {contents: write}
jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y poppler-utils >/dev/null
      - run: |
          mkdir -p reseaux/raw
          curl -sSL -A "Mozilla/5.0" -o reseaux/raw/vitalis.pdf https://vitalis-ci.com/reseau-de-soins.pdf || true
          curl -sSL -A "Mozilla/5.0" -o reseaux/raw/vitalis2.pdf https://demo.vitalis-ci.com/reseau-de-soins.pdf || true
          for f in reseaux/raw/*.pdf; do file $f; pdftotext -layout $f ${f%.pdf}.txt || true; wc -l ${f%.pdf}.txt; done
          if [ "${{ inputs.step }}" = "build" ]; then python3 tools/reseaux.py; fi
      - run: |
          git config user.name clb-bot; git config user.email bot@users.noreply.github.com
          git add reseaux; git commit -m "reseaux: ${{ inputs.step }}" || exit 0; git push
