name: alerte-echecs
# Envoie une notification ntfy quand un workflow échoue sur main.
# Une seule alerte par panne : rien n'est renvoyé tant que le workflow reste en échec.
# Pour recevoir les alertes : appli ntfy › « + » › canal clb-alertes-5dd90ec93ea1.
on:
  workflow_run:
    types: [completed]
    workflows:
      - sentinel-bourse
      - "Données foot CLB World"
      - medocs
      - parfums-data
      - pharma-all
      - pharmacies-garde
      - "Photos d'accueil CLB World"
      - reseaux
      - veritas-veille
      - pages build and deployment
permissions: {actions: read}
jobs:
  alerte:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NTFY_TOPIC: clb-alertes-5dd90ec93ea1
          NOM: ${{ github.event.workflow_run.name }}
          WID: ${{ github.event.workflow_run.workflow_id }}
          RID: ${{ github.event.workflow_run.id }}
          LIEN: ${{ github.event.workflow_run.html_url }}
        run: |
          prev=$(gh api "repos/$REPO/actions/workflows/$WID/runs?branch=main&status=completed&per_page=10" \
            --jq "[.workflow_runs[] | select(.id != $RID) | .conclusion][0] // \"\"")
          echo "exécution précédente : ${prev:-aucune}"
          if [ "$prev" = "failure" ]; then echo "déjà signalé"; exit 0; fi
          python3 - <<'EOF'
          import json, os, urllib.request
          body = json.dumps({"topic": os.environ["NTFY_TOPIC"], "title": "❌ Échec : " + os.environ["NOM"],
                             "message": "Le workflow « " + os.environ["NOM"] + " » a échoué. Touchez pour voir le journal.",
                             "click": os.environ["LIEN"], "tags": ["warning"], "priority": 4}).encode()
          urllib.request.urlopen(urllib.request.Request("https://ntfy.sh/", body, {"Content-Type": "application/json"}), timeout=20)
          print("alerte envoyée")
          EOF
