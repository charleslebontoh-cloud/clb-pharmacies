name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        run: |
          set +e
          AO(){ curl -s -m 30 "https://api.allorigins.win/raw?url=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1],safe=''))" "$1")"; }
          AO "https://www.parfumo.com/s_perfumes_x.php?in=1&filter=sauvage+dior" > /tmp/s
          python3 - <<'P'
          s=open('/tmp/s',encoding='utf-8',errors='ignore').read()
          i=s.find('a28d94-sauvage-eau-de-toilette-dior');print(s[i-1500:i+1800])
          P
          for k in 1 2 3; do AO "https://www.parfumo.com/Perfumes/Dior/Sauvage_Eau_de_Toilette" > /tmp/b; wc -c /tmp/b; grep -c "og:image" /tmp/b && break; sleep 3; done
          python3 - <<'P'
          import re
          s=open('/tmp/b',encoding='utf-8',errors='ignore').read()
          for p in ['og:image','og:description','name="description"','pyramid','notes_list','Top Notes','Head notes','accord']:
              i=s.find(p);print('##',p,i, re.sub(r'\s+',' ',s[max(0,i-200):i+500]) if i>=0 else '')
          P
