name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36"
          curl -sL -A "$UA" -m 40 https://www.brvm.org/fr/cours-actions/0 -o c.html
          python3 - <<'P'
          import re
          s=open('c.html',encoding='utf-8').read()
          i=s.find('SERVAIR ABIDJAN');print(s[i-1500:i+1200])
          print('ROWS',len(re.findall(r'<tr',s)))
          P
          for y in "2026-08-12 2026-11-09" "2024-01-01 2024-03-29" "2018-01-01 2018-03-30" "2012-01-02 2012-03-30"; do set -- $y; echo "== sika SNTS $1"; curl -s -A "$UA" -m 40 -H 'Content-Type: application/json' -d "{\"ticker\":\"SNTS\",\"datedeb\":\"$1\",\"datefin\":\"$2\",\"xperiod\":\"0\"}" https://www.sikafinance.com/api/general/GetHistos | head -c 400; echo; done
          for t in SNTS.sn BRVM30 BRVMPR; do echo "== $t"; curl -s -A "$UA" -m 40 -H 'Content-Type: application/json' -d "{\"ticker\":\"$t\",\"datedeb\":\"2026-10-01\",\"datefin\":\"2026-11-09\",\"xperiod\":\"0\"}" https://www.sikafinance.com/api/general/GetHistos | head -c 200; echo; done
          echo "== actu"; curl -sL -A "$UA" -m 40 https://www.sikafinance.com/marches/actualites_bourse_brvm -o a.html; grep -o '<a[^>]*href="[^"]*"[^>]*>[^<]\{25,\}</a>' a.html | head -25
          echo "== societe SNTS"; curl -sL -A "$UA" -m 40 "https://www.sikafinance.com/marches/cotation_SNTS.sn" -o s.html; python3 -c "
          import re;s=open('s.html',encoding='utf-8').read();t=re.sub(r'<script.*?</script>',' ',s,flags=re.S);t=re.sub(r'<[^>]+>','|',t);t=re.sub(r'\s+',' ',t);t=re.sub(r'(\| ?)+','|',t)
          i=t.find('Dividende');print(t[max(0,i-2500):i+2500])"
          echo "== brvm fiche"; curl -sL -A "$UA" -m 40 "https://www.brvm.org/fr/emetteurs/societes-cotees" -o e.html -w "%{http_code} %{size_download}\n"; grep -o 'href="/fr/[^"]*"[^>]*>[^<]\{4,\}' e.html | sed -n '60,90p'
