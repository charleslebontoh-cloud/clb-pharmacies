name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          U="https://www.parfumo.com/Perfumes/Paco_Rabanne/1_Million"
          echo "== direct"; curl -s -A "Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Safari/604.1" -D /tmp/h -o /tmp/b "$U"; head -3 /tmp/h; grep -io '<meta property="og:image"[^>]*>' /tmp/b | head -2; grep -io '<meta property="og:description"[^>]*>' /tmp/b | head -c 300; echo
          echo "== allorigins"; curl -s -D /tmp/h2 -o /tmp/b2 -H "Origin: https://x.github.io" "https://api.allorigins.win/raw?url=$(python3 -c "import urllib.parse;print(urllib.parse.quote('$U',safe=''))")"; head -3 /tmp/h2; grep -i "access-control" /tmp/h2; grep -io '<meta property="og:image"[^>]*>' /tmp/b2 | head -2
          echo "== corsproxy"; curl -s -D /tmp/h3 -o /tmp/b3 -H "Origin: https://x.github.io" "https://corsproxy.io/?url=$U"; head -2 /tmp/h3; grep -i "access-control" /tmp/h3; grep -io '<meta property="og:image"[^>]*>' /tmp/b3 | head -2
          echo "== codetabs"; curl -s -D /tmp/h4 -o /tmp/b4 -H "Origin: https://x.github.io" "https://api.codetabs.com/v1/proxy/?quest=$U"; head -2 /tmp/h4; grep -i "access-control" /tmp/h4; grep -io '<meta property="og:image"[^>]*>' /tmp/b4 | head -2
          echo "== parfumo search"; curl -s -A "Mozilla/5.0" -o /tmp/b5 "https://www.parfumo.com/s_perfumes_x.php?in=1&filter=Sauvage%20Dior"; grep -o 'href="https://www.parfumo.com/Perfumes/[^"]*"' /tmp/b5 | head -5; grep -o 'https://media.parfumo.com/perfumes/[^" ]*' /tmp/b5 | head -3
          echo "== img"; IMG=$(grep -io '<meta property="og:image" content="[^"]*"' /tmp/b | sed 's/.*content="//;s/"$//'); echo $IMG; curl -s -D - -o /dev/null -H "Referer: https://charleslebontoh-cloud.github.io/" "$IMG" | head -5
          echo "== wsrv"; curl -s -D - -o /dev/null "https://wsrv.nl/?url=$IMG&w=400" | head -4
