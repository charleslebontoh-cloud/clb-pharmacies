name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        run: |
          set +e
          curl -s -m 25 "https://r.jina.ai/https://www.parfumo.com/s_perfumes_x.php?in=1&filter=zara+saffron" | head -c 3500
          echo; echo =====PAGE
          curl -s -m 25 "https://r.jina.ai/https://www.parfumo.com/Perfumes/Paco_Rabanne/1_Million" | grep -iE "Image|notes|Top|Heart|Base|accord|Fresh|Spicy" | head -40 | cut -c1-250
          echo =====HDR; curl -s -m 25 -H "X-Return-Format: html" "https://r.jina.ai/https://www.parfumo.com/s_perfumes_x.php?in=1&filter=zara+saffron" | grep -c 'class="col"'
