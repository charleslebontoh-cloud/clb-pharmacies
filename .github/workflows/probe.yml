name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36"
          cat > t.py <<'P'
          import re,sys;s=open(sys.argv[1],encoding='utf-8',errors='ignore').read();t=re.sub(r'<script.*?</script>|<style.*?</style>',' ',s,flags=re.S);t=re.sub(r'<[^>]+>','|',t);t=re.sub(r'\s+',' ',t);t=re.sub(r'(\| ?)+','|',t);import html;t=html.unescape(t)
          k=sys.argv[2];i=t.find(k);print(t[max(0,i-300):i+int(sys.argv[3])])
          P
          for u in "societe/SNTS.sn|Chiffre|3500" "analyses/conseil/SNTS.sn|CONSEIL|2000" "actualites_bourse_brvm|ACTUALIT|2500" "dividendes|Dividende|2000" "palmares|Palmar|1200"; do IFS='|' read p k n <<< "$u"; case $p in analyses*) url=https://www.sikafinance.com/$p;; *) url=https://www.sikafinance.com/marches/$p;; esac; echo "== $url"; curl -sL -A "$UA" -m 40 "$url" -o x.html -w "%{http_code} %{size_download}\n"; python3 t.py x.html "$k" $n; done
          grep -o 'href="/marches/[a-z0-9-]*_[0-9]*"' x.html | head -3
          echo "== jina brvm"; curl -s -m 60 "https://r.jina.ai/https://www.brvm.org/fr/cours-actions/0" | head -c 800
