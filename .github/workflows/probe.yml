name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36"
          curl -sL -A "$UA" -m 40 "https://www.sikafinance.com/marches/cotation_SNTS.sn" -o s.html
          grep -o 'href="[^"]*"[^>]*>\(Actualités du marché\|Communiqués des sociétés\|Dividendes à venir\|SOCIETE\|ANALYSE ET CONSEILS\|HISTORIQUES\|ACTUS\|EVENEMENTS\)' s.html
          grep -o 'href="/marches/[^"]*"' s.html | sort -u | head -40
          for u in societe_SNTS.sn analyse_SNTS.sn; do echo "== $u"; curl -sL -A "$UA" -m 40 "https://www.sikafinance.com/marches/$u" -o x.html -w "%{http_code} %{size_download}\n"; python3 -c "
          import re;s=open('x.html',encoding='utf-8',errors='ignore').read();t=re.sub(r'<script.*?</script>|<style.*?</style>',' ',s,flags=re.S);t=re.sub(r'<[^>]+>','|',t);t=re.sub(r'\s+',' ',t);t=re.sub(r'(\| ?)+','|',t)
          i=t.find('Chiffre');print(t[max(0,i-1500):i+3000] if i>0 else t[3000:6000])"; done
          for t in SNTS.sn ORAC.ci BOAB.bj SLBC.ci ONTBF.bf BOAM.ml BOAN.ne ETIT.tg SGBC.ci; do echo "== $t"; curl -s -A "$UA" -m 40 -H 'Content-Type: application/json' -d "{\"ticker\":\"$t\",\"datedeb\":\"2016-01-04\",\"datefin\":\"2016-03-31\",\"xperiod\":\"0\"}" https://www.sikafinance.com/api/general/GetHistos | head -c 150; echo; done
