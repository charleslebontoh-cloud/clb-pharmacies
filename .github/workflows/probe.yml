name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        run: |
          set +e
          echo "== jina jumia"; curl -s -m 30 "https://r.jina.ai/https://www.jumia.ci/catalog/?q=dior+sauvage" > /tmp/j; wc -c /tmp/j; grep -iE "FCFA|CFA" /tmp/j | head -12 | cut -c1-250
          echo "== ao jumia"; curl -s -m 30 "https://api.allorigins.win/get?url=https%3A%2F%2Fwww.jumia.ci%2Fcatalog%2F%3Fq%3Ddior%2Bsauvage" > /tmp/a; wc -c /tmp/a; grep -o 'class=\\"prc\\">[^<]*' /tmp/a | head -5; grep -o '"name\\":\\"[^\\]*' /tmp/a | head -3
          echo "== jina notino"; curl -s -m 30 "https://r.jina.ai/https://www.notino.fr/search.asp?exps=dior%20sauvage" > /tmp/n; wc -c /tmp/n; grep -E "€" /tmp/n | head -6 | cut -c1-200
