name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          AO(){ curl -s -m 25 "https://api.allorigins.win/raw?url=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1],safe=''))" "$1")"; }
          AO "https://www.parfumo.com/Perfumes/Paco_Rabanne/1_Million" > /tmp/b
          echo "== imgs"; grep -o 'https://media.parfumo.com/perfumes/[^" ]*' /tmp/b | sort -u | head -8
          echo "== desc"; grep -io '<meta name="description"[^>]*>' /tmp/b | head -c 400; echo
          echo "== search"; AO "https://www.parfumo.com/s_perfumes_x.php?in=1&filter=sauvage+dior" > /tmp/s; wc -c /tmp/s; grep -o 'href="https://www.parfumo.com/Perfumes/[^"]*"' /tmp/s | sort -u | head -8; grep -o 'https://media.parfumo.com/perfumes/[^" ]*' /tmp/s | head -4
          echo "== search2"; AO "https://www.parfumo.com/search?q=sauvage" > /tmp/s2; wc -c /tmp/s2; grep -o 'href="https://www.parfumo.com/Perfumes/[^"]*"' /tmp/s2 | sort -u | head -8
          echo "== img hotlink"; I=$(grep -o 'https://media.parfumo.com/perfumes/[^" ]*' /tmp/b | head -1); echo $I; curl -s -D - -o /dev/null -H "Referer: https://charleslebontoh-cloud.github.io/" "$I" | head -4
          echo "== social"; curl -s -D - -o /dev/null -H "Referer: https://charleslebontoh-cloud.github.io/" "https://media.parfumo.com/perfume_social/fc/fc9d08-1-million-eau-de-toilette-rabanne_1200.jpg?format=jpg&quality=90" | head -4
