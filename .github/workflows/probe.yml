name: Sonde API
on:
  workflow_dispatch:
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in "https://abacus.jasoncameron.dev/hit/clb-health-test/probe" "https://abacus.jasoncameron.dev/get/clb-health-test/probe" "https://api.counterapi.dev/v1/clb-health-test/probe/up" "https://fr.wikipedia.org/api/rest_v1/page/summary/Amoxicilline"; do
            echo "== $u"; curl -s -m 20 -D - -H "Origin: https://charleslebontoh-cloud.github.io" "$u" -o /tmp/b | grep -i "^HTTP\|access-control-allow-origin"; head -c 300 /tmp/b; echo; done
