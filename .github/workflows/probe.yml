name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        run: |
          set +e
          curl -s -m 30 "https://r.jina.ai/https://www.notino.fr/search.asp?exps=dior%20sauvage" > /tmp/n
          grep -n "Image 10\|Image 11\|Image 12" /tmp/n | head; L=$(grep -n "Image 10:" /tmp/n | cut -d: -f1); sed -n "$((L-3)),$((L+30))p" /tmp/n | cut -c1-400
          echo "== zara"; curl -s -m 30 "https://r.jina.ai/https://www.notino.fr/search.asp?exps=zara%20vibrant%20leather" | grep -E "€|Image [0-9]+:" | head -8 | cut -c1-300
