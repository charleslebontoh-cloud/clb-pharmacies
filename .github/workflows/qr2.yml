name: qr2
on: workflow_dispatch
permissions:
  contents: write
jobs:
  q:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          pip install -q segno
          python -c "import segno;segno.make('https://charleslebontoh-cloud.github.io/clb-pharmacies/compliance/',error='m').save('compliance/qr.png',scale=10,border=1,dark='#0B3D2E')"
          git config user.name veritas-bot; git config user.email actions@users.noreply.github.com
          git rm -q .github/workflows/qr2.yml
          git add compliance/qr.png; git commit -qm "VERITAS : QR code de partage"; git pull -q --rebase origin main; git push -q
