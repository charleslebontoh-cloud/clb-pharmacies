name: Photos d'accueil CLB World
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/fetch_photos.py
      - run: |
          git config user.name "clb-bot" && git config user.email "clb-bot@users.noreply.github.com"
          git add monde/photos && git commit -qm "Photos candidates pour l'accueil (Wikimedia Commons)" && git pull -q --rebase && git push -q
