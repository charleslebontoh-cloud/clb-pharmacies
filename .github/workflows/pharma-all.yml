name: pharma-all
on:
  workflow_dispatch:
  schedule: [{cron: "17 3 1 * *"}]
permissions: {contents: write}
jobs:
  b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/pharma_all.py
      - run: |
          git config user.name clb-bot; git config user.email bot@users.noreply.github.com
          git add pharmacies-all.json; git commit -m "pharmacies : liste complète" || exit 0
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done
