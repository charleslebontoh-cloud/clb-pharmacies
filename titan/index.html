<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#05070a">
<title>TITAN · CLB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;600;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--ink:#f4efe6;--soft:#b9b2a6;--gold:#e8b25c;--glass:rgba(18,20,26,.55);--edge:rgba(255,220,170,.16);--ok:#3fd68a}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:#05070a;color:var(--ink);font:16px/1.5 Sora,system-ui,sans-serif;overflow:hidden}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block}
.ui{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:max(22px,env(safe-area-inset-top)) 18px max(22px,env(safe-area-inset-bottom));pointer-events:none}
.ui>*{pointer-events:auto}
header{text-align:center}
h1{margin:0;font-weight:800;font-size:clamp(34px,9vw,52px);letter-spacing:.32em;padding-left:.32em;line-height:1;background:linear-gradient(180deg,#fff6e4 0%,#e8b25c 55%,#8a5a22 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 18px rgba(232,178,92,.35))}
.sub{margin-top:8px;font-weight:300;font-size:14px;color:var(--soft)}
.bottom{width:min(100%,380px);display:flex;flex-direction:column;align-items:center;gap:14px}
.status{font-weight:600;font-size:15px;letter-spacing:.04em;min-height:22px;text-shadow:0 2px 10px #000}
button{font:600 17px Sora,sans-serif;min-height:60px;width:100%;border:1px solid rgba(255,230,190,.45);border-radius:30px;cursor:pointer;color:#1c1105;background:linear-gradient(180deg,#ffe2a8 0%,#e8b25c 45%,#b07a32 100%);box-shadow:0 12px 30px rgba(232,178,92,.28),inset 0 1px 0 rgba(255,255,255,.7),inset 0 -3px 8px rgba(80,40,0,.35);transition:transform .15s}
button:active{transform:scale(.98)}
button.stop{color:#ffe9e9;background:linear-gradient(180deg,#7a2626,#3d1010);border-color:rgba(255,150,150,.35);box-shadow:0 12px 30px rgba(180,40,40,.3),inset 0 1px 0 rgba(255,255,255,.25)}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
.loc{width:100%;border:1px solid var(--edge);border-radius:20px;padding:14px 16px;background:var(--glass);backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);font-size:13px;color:var(--soft);display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:center}
.loc b{color:var(--ink);font-size:15px;font-weight:600}
.loc span:last-child{grid-column:2}
.dot{width:10px;height:10px;border-radius:50%;background:#555;box-shadow:0 0 0 3px rgba(255,255,255,.06)}
.dot.on{background:var(--ok);box-shadow:0 0 12px var(--ok)}
small{font-size:12px;color:#8f887d;text-align:center;font-weight:300}
.fallback .orbcss{display:block}
.orbcss{display:none;position:fixed;left:50%;top:44%;width:min(62vw,280px);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 34% 28%,#fff3d6 0,#e8b25c 22%,#7a4a18 60%,#1a0e04 100%);box-shadow:0 0 80px rgba(232,178,92,.35)}
</style>
</head>
<body>
<canvas id="scene" aria-hidden="true"></canvas>
<div class="orbcss" aria-hidden="true"></div>
<div class="ui">
  <header>
    <h1>TITAN</h1>
    <div class="sub">Ton compagnon · il sait où tu es</div>
  </header>
  <div class="bottom">
    <div class="status" id="status">Prêt</div>
    <button id="btn">Parler à TITAN</button>
    <div class="loc"><span class="dot" id="dot"></span><b id="place">Position pas encore partagée</b><span id="coords"></span></div>
    <small>Position envoyée seulement pendant la conversation · écouteurs conseillés</small>
  </div>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<!-- 3D scene -->
<script type="module">
import * as THREE from "three";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

const S = window.TITAN3D = { level: 0, mode: "idle" }; // mode: idle | listen | talk
try {
  const canvas = document.getElementById("scene");
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: "high-performance" });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x05070a);
  scene.fog = new THREE.FogExp2(0x05070a, 0.06);
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

  const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 100);
  camera.position.set(0, 0.15, 6.2);

  // lights: warm key, cool rim, gold under-glow
  const key = new THREE.DirectionalLight(0xfff0d8, 2.6); key.position.set(3, 4, 5); scene.add(key);
  const rim = new THREE.DirectionalLight(0x6fa8ff, 1.6); rim.position.set(-4, 1, -3); scene.add(rim);
  const glow = new THREE.PointLight(0xffa640, 30, 8, 2); glow.position.set(0, -1.6, 1.2); scene.add(glow);

  const core = new THREE.Group(); scene.add(core);

  // inner molten core with animated displacement (reacts to the voice)
  const uni = { uTime: { value: 0 }, uAmp: { value: 0.04 } };
  const coreMat = new THREE.MeshPhysicalMaterial({ color: 0xc9893a, metalness: 1, roughness: 0.22, clearcoat: 1, clearcoatRoughness: 0.08, emissive: 0x3a1a02, emissiveIntensity: 0.6 });
  coreMat.onBeforeCompile = sh => {
    Object.assign(sh.uniforms, uni);
    sh.vertexShader = sh.vertexShader.replace("#include <common>", `#include <common>
      uniform float uTime; uniform float uAmp;
      float wav(vec3 p){return sin(p.x*3.1+uTime*1.7)*sin(p.y*2.7+uTime*1.3)*sin(p.z*3.3+uTime*1.1)+0.5*sin(p.x*7.0-uTime*2.3+p.y*5.0);}`)
      .replace("#include <begin_vertex>", `#include <begin_vertex>
      float d = wav(position*1.2); transformed += normal * d * uAmp;`);
  };
  const coreMesh = new THREE.Mesh(new THREE.IcosahedronGeometry(1, 96), coreMat);
  core.add(coreMesh);

  // glass shell
  const shell = new THREE.Mesh(new THREE.SphereGeometry(1.32, 96, 64), new THREE.MeshPhysicalMaterial({ color: 0xffffff, metalness: 0, roughness: 0.04, transmission: 1, thickness: 0.6, ior: 1.45, clearcoat: 1, transparent: true, opacity: 1, envMapIntensity: 1.4, attenuationColor: new THREE.Color(0xffd9a0), attenuationDistance: 3 }));
  core.add(shell);

  // two brushed-titanium rings
  const ringMat = new THREE.MeshStandardMaterial({ color: 0xb9b4ad, metalness: 1, roughness: 0.28 });
  const goldMat = new THREE.MeshStandardMaterial({ color: 0xe8b25c, metalness: 1, roughness: 0.18, emissive: 0x2a1500, emissiveIntensity: 0.4 });
  const ring1 = new THREE.Mesh(new THREE.TorusGeometry(1.72, 0.035, 24, 220), ringMat);
  const ring2 = new THREE.Mesh(new THREE.TorusGeometry(1.95, 0.018, 16, 220), goldMat);
  ring1.rotation.x = Math.PI * 0.42; ring2.rotation.x = Math.PI * 0.58; ring2.rotation.y = 0.35;
  core.add(ring1, ring2);

  // small orbiting satellites on the gold ring
  const sats = [];
  for (let i = 0; i < 3; i++) { const m = new THREE.Mesh(new THREE.SphereGeometry(0.055, 24, 16), goldMat); ring2.add(m); sats.push(m); }

  // reflective floor with soft reflection of the orb
  const floor = new THREE.Mesh(new THREE.CircleGeometry(9, 96), new THREE.MeshStandardMaterial({ color: 0x0b0d11, metalness: 0.9, roughness: 0.35 }));
  floor.rotation.x = -Math.PI / 2; floor.position.y = -2.15; scene.add(floor);

  // dust particles
  const N = 900, pos = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) { const r = 2.5 + Math.random() * 6, a = Math.random() * Math.PI * 2, h = (Math.random() - 0.5) * 6; pos.set([Math.cos(a) * r, h, Math.sin(a) * r - 2], i * 3); }
  const pg = new THREE.BufferGeometry(); pg.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  const dust = new THREE.Points(pg, new THREE.PointsMaterial({ color: 0xffd7a0, size: 0.025, transparent: true, opacity: 0.55, depthWrite: false }));
  scene.add(dust);

  // bloom
  const composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));
  const bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), 0.55, 0.6, 0.82);
  composer.addPass(bloom);
  composer.addPass(new OutputPass());

  const resize = () => {
    const w = innerWidth, h = innerHeight;
    renderer.setSize(w, h, false); composer.setSize(w, h); bloom.setSize(w, h);
    camera.aspect = w / h;
    camera.position.z = w / h < 0.7 ? 8.2 : 6.2;   // phone portrait: step back
    core.position.y = w / h < 0.7 ? 0.55 : 0.25;
    camera.updateProjectionMatrix();
  };
  addEventListener("resize", resize); resize();

  // tilt with finger / mouse
  let tx = 0, ty = 0;
  addEventListener("pointermove", e => { tx = (e.clientX / innerWidth - 0.5) * 0.5; ty = (e.clientY / innerHeight - 0.5) * 0.3; });

  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const clock = new THREE.Clock();
  let lvl = 0;
  const tick = () => {
    const t = clock.getElapsedTime();
    lvl += (S.level - lvl) * 0.18;
    const base = S.mode === "talk" ? 0.07 : S.mode === "listen" ? 0.045 : 0.03;
    uni.uTime.value = reduce ? 0 : t * (S.mode === "talk" ? 1.6 : 0.8);
    uni.uAmp.value = base + lvl * 0.22;
    const breathe = reduce ? 1 : 1 + Math.sin(t * 1.2) * 0.012 + lvl * 0.06;
    core.scale.setScalar(breathe);
    core.rotation.y += reduce ? 0 : 0.0025;
    ring1.rotation.z = t * 0.18; ring2.rotation.z = -t * 0.26;
    sats.forEach((m, i) => { const a = t * 0.9 + i * 2.094; m.position.set(Math.cos(a) * 1.95, Math.sin(a) * 1.95, 0); });
    const target = S.mode === "talk" ? 0xffb04a : S.mode === "listen" ? 0x57d6ff : 0xffa640;
    glow.color.lerp(new THREE.Color(target), 0.06);
    glow.intensity = 22 + lvl * 90 + (S.mode === "listen" ? 10 : 0);
    coreMat.emissiveIntensity = 0.5 + lvl * 2.2;
    bloom.strength = 0.45 + lvl * 0.9;
    dust.rotation.y = t * 0.02;
    camera.position.x += (tx - camera.position.x) * 0.05;
    camera.position.y += (0.15 - ty - camera.position.y) * 0.05;
    camera.lookAt(0, core.position.y * 0.6, 0);
    composer.render();
    requestAnimationFrame(tick);
  };
  tick();
} catch (e) {
  document.body.classList.add("fallback");
  console.error("3D indisponible", e);
}
</script>

<!-- conversation + live location -->
<script type="module">
import { Conversation } from "https://cdn.jsdelivr.net/npm/@elevenlabs/client/+esm";
const AGENT = "agent_1501m8gypmc0ef1rjshjw9sxfzsy";
const $ = id => document.getElementById(id);
const S = () => window.TITAN3D || { level: 0, mode: "idle" };
let conv = null, watchId = null, pos = null, placeName = "", lastGeo = 0, meter = null;

async function nameOf(lat, lon) {
  try {
    const r = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=fr`);
    const j = await r.json();
    const admin = (j.localityInfo?.administrative || []).map(a => a.name);
    const parts = [j.locality, j.city, admin[admin.length - 1], j.countryName].filter(Boolean);
    return [...new Set(parts)].join(", ");
  } catch { return ""; }
}

function startWatch() {
  return new Promise(res => {
    if (!navigator.geolocation) { $("place").textContent = "GPS indisponible sur cet appareil"; return res(); }
    let first = true;
    watchId = navigator.geolocation.watchPosition(async p => {
      pos = p.coords;
      $("dot").classList.add("on");
      $("coords").textContent = `${pos.latitude.toFixed(5)}, ${pos.longitude.toFixed(5)} · ±${Math.round(pos.accuracy)} m`;
      if (Date.now() - lastGeo > 30000) {
        lastGeo = Date.now();
        placeName = await nameOf(pos.latitude, pos.longitude);
        $("place").textContent = placeName || "Position reçue";
      }
      if (first) { first = false; res(); }
    }, err => {
      $("place").textContent = err.code === 1 ? "Localisation refusée : Réglages > Safari > Position" : "Position introuvable";
      if (first) { first = false; res(); }
    }, { enableHighAccuracy: true, maximumAge: 5000, timeout: 15000 });
  });
}

function locationReport() {
  if (!pos) return "Position indisponible : Charles n'a pas autorisé la localisation ou le GPS ne répond pas.";
  const speed = pos.speed != null && pos.speed > 0.5 ? ` Vitesse : ${Math.round(pos.speed * 3.6)} km/h.` : "";
  return `Position actuelle de Charles : ${placeName || "lieu inconnu"}. Coordonnées GPS : ${pos.latitude.toFixed(5)}, ${pos.longitude.toFixed(5)} (précision ±${Math.round(pos.accuracy)} m).${speed} Lien carte : https://maps.google.com/?q=${pos.latitude},${pos.longitude}`;
}

function setMode(m, label) { S().mode = m; if (label) $("status").textContent = label; }

async function start() {
  $("btn").disabled = true;
  setMode("idle", "Connexion…");
  try {
    await navigator.mediaDevices.getUserMedia({ audio: true });
    await startWatch();
    conv = await Conversation.startSession({
      agentId: AGENT,
      connectionType: "websocket",
      clientTools: { position_actuelle: async () => locationReport() },
      onConnect: () => setMode("listen", "TITAN t'écoute"),
      onDisconnect: stopUi,
      onError: e => { $("status").textContent = "Erreur : " + (e?.message || e); },
      onModeChange: m => m.mode === "speaking" ? setMode("talk", "TITAN parle") : setMode("listen", "TITAN t'écoute")
    });
    meter = setInterval(() => {
      if (!conv) return;
      try { const v = S().mode === "talk" ? conv.getOutputVolume() : conv.getInputVolume() * 0.6; S().level = Math.min(1, v * 1.6); } catch {}
    }, 50);
    $("btn").textContent = "Raccrocher";
    $("btn").className = "stop";
  } catch (e) {
    $("status").textContent = e?.name === "NotAllowedError" ? "Autorise le micro pour parler à TITAN" : "Impossible de joindre TITAN";
    stopUi(true);
  }
  $("btn").disabled = false;
}

function stopUi(keepMsg) {
  if (watchId != null) navigator.geolocation.clearWatch(watchId);
  watchId = null; clearInterval(meter); meter = null;
  S().level = 0;
  $("dot").classList.remove("on");
  $("btn").textContent = "Parler à TITAN";
  $("btn").className = "";
  setMode("idle", keepMsg === true ? null : "À tout à l'heure");
  conv = null;
}

$("btn").addEventListener("click", async () => {
  if (conv) { await conv.endSession(); stopUi(); } else start();
});
</script>
</body>
